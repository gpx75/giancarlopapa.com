name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Runtime config public guard
        run: npm run check:runtime-public

      - name: Build
        run: npm run build
        env:
          VERCEL: '1'
          NUXT_CAL_API_KEY: ${{ secrets.NUXT_CAL_API_KEY }}
          NUXT_CAL_USERNAME: ${{ secrets.NUXT_CAL_USERNAME }}
          NUXT_CAL_BASE_URL: ${{ secrets.NUXT_CAL_BASE_URL }}
          NUXT_PUBLIC_SITE_URL: ${{ secrets.NUXT_PUBLIC_SITE_URL }}
          NUXT_CONTACT_EMAIL: ${{ secrets.NUXT_CONTACT_EMAIL }}
          NUXT_RESEND_API_KEY: ${{ secrets.NUXT_RESEND_API_KEY }}
          NUXT_RESEND_TO_EMAIL: ${{ secrets.NUXT_RESEND_TO_EMAIL }}
          NUXT_RESEND_AUDIENCE_ID: ${{ secrets.NUXT_RESEND_AUDIENCE_ID }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_OAUTH_GITHUB_CLIENT_ID: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_ID }}
          NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_SECRET }}
          NUXT_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_ID }}
          NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_SECRET }}
          NUXT_OAUTH_LINKEDIN_CLIENT_ID: ${{ secrets.NUXT_OAUTH_LINKEDIN_CLIENT_ID }}
          NUXT_OAUTH_LINKEDIN_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_LINKEDIN_CLIENT_SECRET }}
          NUXT_PUBLIC_GTAG_ID: ${{ secrets.NUXT_PUBLIC_GTAG_ID }}
          NUXT_STRAVA_CLIENT_ID: ${{ secrets.NUXT_STRAVA_CLIENT_ID }}
          NUXT_STRAVA_CLIENT_SECRET: ${{ secrets.NUXT_STRAVA_CLIENT_SECRET }}
          NUXT_STRAVA_REFRESH_TOKEN: ${{ secrets.NUXT_STRAVA_REFRESH_TOKEN }}
          NUXT_GMAIL_USER: ${{ secrets.NUXT_GMAIL_USER }}
          NUXT_GMAIL_APP_PASSWORD: ${{ secrets.NUXT_GMAIL_APP_PASSWORD }}
          NUXT_ANTHROPIC_API_KEY: ${{ secrets.NUXT_ANTHROPIC_API_KEY }}
          NUXT_RAPID_API_KEY: ${{ secrets.NUXT_RAPID_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
